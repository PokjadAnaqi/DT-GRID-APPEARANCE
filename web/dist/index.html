<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Prata&family=Syne:wght@700;800&family=Chakra+Petch:wght@400;600;700&family=Abril+Fatface&family=Pirata+One&family=Outfit:wght@300;400;500;600;700;800;900&family=Rajdhani:wght@400;500;600;700&display=swap&subset=latin-ext" rel="stylesheet" />
  <title>Appearance</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: transparent; font-family: 'Outfit', sans-serif; }
  </style>
  <script type="module" crossorigin src="./assets/index.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index.css">
</head>
<body>
  <div id="app"></div>

  <!-- DT GRID compact creator save fallback. Runtime dist may not be rebuilt,
       so this creates the same square SAVE icon as the Vue sidebar. -->
  <style>
    #dt-creator-save-shim {
      position: fixed; z-index: 100000; display: none; width: 48px; height: 48px;
      padding: 0; align-items: center; justify-content: center;
      border: 1px solid rgba(16,185,129,.34); border-radius: 2px;
      background: rgba(6,23,18,.88); color: #34d399;
      box-shadow: inset 0 0 14px rgba(16,185,129,.08); cursor: pointer;
      transition: border-color .14s ease, background .14s ease, color .14s ease, transform .14s ease;
    }
    #dt-creator-save-shim:hover { border-color: rgba(52,211,153,.72); background: rgba(8,35,26,.94); color:#6ee7b7; transform: translateY(-1px); }
    #dt-creator-save-shim svg { width: 20px; height: 20px; fill: currentColor; }
  </style>
  <button id="dt-creator-save-shim" type="button" aria-label="Save Character">
    <svg viewBox="0 0 448 512" aria-hidden="true"><path d="M64 32C28.7 32 0 60.7 0 96v320c0 35.3 28.7 64 64 64h320c35.3 0 64-28.7 64-64V173.3c0-17-6.7-33.3-18.7-45.3L352 50.7C340 38.7 323.7 32 306.7 32H64zm32 96c0-17.7 14.3-32 32-32h160c17.7 0 32 14.3 32 32v64c0 17.7-14.3 32-32 32H128c-17.7 0-32-14.3-32-32v-64zm128 160a64 64 0 1 1 0 128 64 64 0 1 1 0-128z"/></svg>
  </button>
  <script>
    (() => {
      const button = document.getElementById('dt-creator-save-shim');
      if (!button) return;
      const sync = () => {
        const creator = document.body.classList.contains('theme-creator');
        const sidebar = document.querySelector('.dt-apocalypse-sidebar');
        if (!creator || !sidebar) { button.style.display = 'none'; return; }
        // If a rebuilt Vue UI already exposes the native save button, do not duplicate it.
        if (sidebar.querySelector('.dt-sidebar-save')) { button.style.display = 'none'; return; }
        const buttons = Array.from(sidebar.querySelectorAll('button')).filter((el) => {
          const r = el.getBoundingClientRect(); return r.width > 0 && r.height > 0;
        });
        const exitButton = sidebar.querySelector('.dt-sidebar-exit') || (buttons.length ? buttons[buttons.length - 1] : null);
        const sideRect = sidebar.getBoundingClientRect();
        const anchor = exitButton ? exitButton.getBoundingClientRect() : sideRect;
        const width = Math.round(exitButton && anchor.width > 0 ? anchor.width : 48);
        const height = Math.round(exitButton && anchor.height > 0 ? anchor.height : 48);
        const gap = 8;
        button.style.display = 'flex';
        button.style.width = `${width}px`;
        button.style.height = `${height}px`;
        button.style.minWidth = `${width}px`;
        button.style.minHeight = `${height}px`;
        button.style.maxWidth = `${width}px`;
        button.style.maxHeight = `${height}px`;
        button.style.left = `${Math.round(exitButton ? anchor.left : sideRect.left + (sideRect.width - width) / 2)}px`;
        button.style.top = `${Math.round(exitButton ? anchor.top - height - gap : sideRect.bottom - (height * 2) - gap - 8)}px`;
      };
      button.addEventListener('click', () => {
        window.dispatchEvent(new KeyboardEvent('keydown', { key:'Enter', code:'Enter', bubbles:true }));
      });
      const observer = new MutationObserver(sync);
      observer.observe(document.documentElement, { attributes:true, subtree:true, childList:true });
      window.addEventListener('resize', sync);
      requestAnimationFrame(sync);
    })();
  </script>

</body>
</html>
